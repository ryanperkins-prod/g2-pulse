services:
  # Backend API
  - type: web
    name: g2-pulse-api
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend
  - type: web
    name: g2-pulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://g2-pulse-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
